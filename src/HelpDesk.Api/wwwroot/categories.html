<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories - HelpDesk</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="categories" data-title="Categories">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar">
                <div style="display:flex;align-items:center;gap:12px">
                    <button class="menu-toggle" onclick="UI.toggleSidebar()">&#9776;</button>
                    <h2 data-page-title>Categories</h2>
                </div>
                <div class="user-area" id="userArea"></div>
            </header>
            <main class="content">
                <div class="panel">
                    <div class="panel-header">
                        <h3>Ticket categories</h3>
                        <button class="btn hidden" id="newCategoryButton" type="button">New Category</button>
                    </div>
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>Tickets</th>
                                    <th>Status</th>
                                    <th class="actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="categoriesBody">
                                <tr><td colspan="5"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal-backdrop hidden" id="categoryModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">New category</h3>
                <button class="btn btn-secondary btn-sm" type="button" id="modalCloseButton">Close</button>
            </div>
            <form id="categoryForm">
                <div class="modal-body">
                    <div id="modalError" class="alert alert-error hidden"></div>
                    <div class="form-group">
                        <label for="categoryName">Name</label>
                        <input class="form-control" type="text" id="categoryName" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="categoryDescription">Description</label>
                        <textarea class="form-control" id="categoryDescription" maxlength="500" style="min-height:80px"></textarea>
                    </div>
                    <div class="checkbox-row">
                        <input type="checkbox" id="categoryActive" checked>
                        <label for="categoryActive" style="font-weight:400;margin:0">Active</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" id="modalCancelButton">Cancel</button>
                    <button class="btn" type="submit" id="modalSaveButton">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
