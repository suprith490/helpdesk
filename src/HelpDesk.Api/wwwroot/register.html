<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - HelpDesk</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand">
                <span class="brand-badge">HD</span>
                <div>
                    <h1 class="mb-0">HelpDesk</h1>
                    <p class="subtitle mb-0">Create your account</p>
                </div>
            </div>
            <div id="formError" class="alert alert-error hidden"></div>
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First name</label>
                        <input class="form-control" type="text" id="firstName" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last name</label>
                        <input class="form-control" type="text" id="lastName" required maxlength="100">
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input class="form-control" type="email" id="email" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input class="form-control" type="password" id="password" required minlength="6" autocomplete="new-password">
                    <div class="form-hint">At least 6 characters.</div>
                </div>
                <div class="form-group">
                    <label for="departmentId">Department</label>
                    <select class="form-select" id="departmentId">
                        <option value="">Select a department</option>
                    </select>
                </div>
                <button class="btn btn-block" type="submit" id="registerButton">Create account</button>
            </form>
            <p class="text-muted mt-2" style="text-align:center">
                Already registered? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
